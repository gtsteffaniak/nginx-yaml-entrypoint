name: regular tests

on:
  pull_request:
    branches:
      - "**"

jobs:
  regression-tests:
    name: Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - simple-proxy
          - api-gateway
          - comprehensive
          - load-balancer
          - ssl-website
          - websocket-app
          - template-system
          - simple-templates
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup test environment
      run: |
        mkdir -p test/ssl test/mock-responses
        # Generate test SSL certificates
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout test/ssl/key.pem -out test/ssl/cert.pem \
          -subj "/C=US/ST=Test/L=Test/O=Test/OU=Test/CN=localhost"
        # Create mock response
        echo "<h1>Mock Backend Response - ${{ matrix.service }}</h1>" > test/mock-responses/index.html

    - name: Run Docker Compose Test
      uses: adambirds/docker-compose-action@v1.5.0
      with:
        compose-file: './docker-compose.test.yml'
        up-flags: '--build'
        down-flags: '--volumes --remove-orphans'
        services: 'test-${{ matrix.service }} mock-backend-1 mock-backend-2 mock-backend-3'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: go test -race -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - uses: golangci/golangci-lint-action@v7
        with:
          version: 'v2.1.6'
          install-mode: goinstall
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: go fmt ./...