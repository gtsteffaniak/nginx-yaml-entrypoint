name: regular tests

on:
  pull_request:
    branches:
      - "**"

jobs:
  regression-tests:
    name: Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - simple-proxy
          - api-gateway
          - comprehensive
          - load-balancer
          - ssl-website
          - websocket-app
          - template-system
          - simple-templates
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v1

    - name: Setup test environment
      run: |
        mkdir -p test/ssl test/mock-responses
        # Generate test SSL certificates
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout test/ssl/key.pem -out test/ssl/cert.pem \
          -subj "/C=US/ST=Test/L=Test/O=Test/OU=Test/CN=localhost"
        # Create mock response
        echo "<h1>Mock Backend Response - ${{ matrix.service }}</h1>" > test/mock-responses/index.html

    - name: Start services and test
      run: |
        # Start mock backends and test service
        docker compose -f docker-compose.test.yml up -d --build \
          test-${{ matrix.service }} mock-backend-1 mock-backend-2 mock-backend-3
        
        # Wait for health checks (built into compose file)
        echo "Waiting for services to be healthy..."
        timeout 120 bash -c 'until [ "$(docker compose -f docker-compose.test.yml ps test-${{ matrix.service }} --format json | jq -r ".[0].Health")" = "healthy" ]; do sleep 2; done'
        
        echo "✅ ${{ matrix.service }} test passed successfully!"

    - name: Show logs on failure
      if: failure()
      run: |
        echo "=== test-${{ matrix.service }} logs ==="
        docker compose -f docker-compose.test.yml logs test-${{ matrix.service }}

    - name: Cleanup
      if: always()
      run: |
        docker compose -f docker-compose.test.yml down -v --remove-orphans

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: go test -race -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - uses: golangci/golangci-lint-action@v7
        with:
          version: 'v2.1.6'
          install-mode: goinstall
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: go fmt ./...