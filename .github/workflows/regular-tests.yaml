name: regular tests

on:
  pull_request:
    branches:
      - "**"

jobs:
  regression-tests:
    name: Test - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simple-proxy
            service: test-simple-proxy
          - name: api-gateway
            service: test-api-gateway
          - name: comprehensive
            service: test-comprehensive
          - name: load-balancer
            service: test-load-balancer
          - name: ssl-website
            service: test-ssl-website
          - name: websocket-app
            service: test-websocket-app
          - name: template-system
            service: test-template-system
          - name: simple-templates
            service: test-simple-templates
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start mock backends
      run: |
        docker compose -f docker-compose.test.yml up -d mock-backend-1 mock-backend-2 mock-backend-3
        # Wait for backends to be ready
        sleep 10

    - name: Build and start ${{ matrix.name }} test
      run: |
        docker compose -f docker-compose.test.yml up -d ${{ matrix.service }}
        # Wait for service to be ready
        sleep 15

    - name: Test ${{ matrix.name }} configuration
      run: |
        # Wait for health check to pass
        timeout 60 bash -c 'until docker compose -f docker-compose.test.yml ps ${{ matrix.service }} | grep -q "healthy"; do sleep 2; done'
        
        # Health check already validates the configuration is working
        echo "${{ matrix.name }} test passed successfully"

    - name: Get container logs on failure
      if: failure()
      run: |
        echo "=== ${{ matrix.service }} logs ==="
        docker compose -f docker-compose.test.yml logs ${{ matrix.service }}
        echo "=== Mock backend logs ==="
        docker compose -f docker-compose.test.yml logs mock-backend-1 mock-backend-2 mock-backend-3

    - name: Archive test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ matrix.name }}
        path: |
          test/logs/
          docker-compose.test.yml
        retention-days: 5

    - name: Cleanup
      if: always()
      run: |
        docker compose -f docker-compose.test.yml down -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: go test -race -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - uses: golangci/golangci-lint-action@v7
        with:
          version: 'v2.1.6'
          install-mode: goinstall
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: go fmt ./...