name: regular tests

on:
  pull_request:
    branches:
      - "**"

jobs:
  build_image:
    name: Build nginx image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and cache nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: false
          load: false
          cache-to: |
            type=gha,mode=max,scope=${{ github.ref_name }}-nginx-yaml-entrypoint

  regression-tests:
    needs: [build_image]
    name: Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - simple-proxy
          - api-gateway
          - comprehensive
          - load-balancer
          - ssl-website
          - websocket-app
          - template-system
          - simple-templates
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v1

    - name: Setup test environment
      run: |
        mkdir -p test/ssl test/mock-responses
        # Generate test SSL certificates
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout test/ssl/key.pem -out test/ssl/cert.pem \
          -subj "/C=US/ST=Test/L=Test/O=Test/OU=Test/CN=localhost"
        # Create mock response
        echo "<h1>Mock Backend Response - ${{ matrix.service }}</h1>" > test/mock-responses/index.html

    - name: Build nginx with cache
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./dockerfile
        tags: nginx-yaml-entrypoint:test
        push: false
        load: true
        cache-from: |
          type=gha,scope=${{ github.ref_name }}-nginx-yaml-entrypoint
          type=gha,scope=main-nginx-yaml-entrypoint

    - name: Update compose file to use cached image
      run: |
        sed -i 's|build:|image: nginx-yaml-entrypoint:test #build:|' docker-compose.test.yml
        sed -i 's|context: .|#context: .|' docker-compose.test.yml
        sed -i 's|dockerfile: dockerfile|#dockerfile: dockerfile|' docker-compose.test.yml

    - name: Run test
      run: |
        # Start the test service and dependencies
        docker compose -f docker-compose.test.yml up -d test-${{ matrix.service }}
        
        # Wait for health check to pass (built into compose file)
        echo "Waiting for test-${{ matrix.service }} to be healthy..."
        timeout 120 bash -c 'until docker compose -f docker-compose.test.yml ps test-${{ matrix.service }} | grep -q "healthy"; do sleep 2; done'
        
        echo "✅ ${{ matrix.service }} test passed!"

    - name: Show logs on failure
      if: failure()
      run: |
        docker compose -f docker-compose.test.yml logs test-${{ matrix.service }}

    - name: Cleanup
      if: always()
      run: |
        docker compose -f docker-compose.test.yml down -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: go test -race -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - uses: golangci/golangci-lint-action@v7
        with:
          version: 'v2.1.6'
          install-mode: goinstall
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: go fmt ./...