# Template-based configuration example
# Shows the power of reusable configuration templates

limit_req_zones:
  - name: global
    key: $binary_remote_addr
    zone: global:10m
    rate: 100r/s
  - name: api
    key: $binary_remote_addr
    zone: api:10m
    rate: 200r/s

limit_req_log_level: error
limit_req_status: 429

# Define reusable templates
templateConfigs:
  # SSL template for easy SSL setup
  withSSL:
    configs:
      ssl_certificate: /etc/letsencrypt/live/example.com/fullchain.pem
      ssl_certificate_key: /etc/letsencrypt/live/example.com/privkey.pem
      ssl_protocols: "TLSv1.2 TLSv1.3"
      ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
      ssl_session_cache: "shared:SSL:10m"
      ssl_session_timeout: "10m"

  # WebSocket support template  
  webSocketSupport:
    configs:
      proxy_http_version: "1.1"
      proxy_read_timeout: 86400s
      proxy_send_timeout: 86400s
    proxy_set_header:
      Upgrade: "$http_upgrade"
      Connection: "$connection_upgrade"

  # Authentication template
  withAuthentication:
    proxy_set_header:
      X-Forwarded-User: "$user"
      Authorization: "$http_authorization"
    configs:
      auth_request: "/auth/authorize"
    auth_request_set:
      "$auth_status": "$upstream_status"
      "$user": "$upstream_http_x_user"

  # Production optimizations template
  productionOptimized:
    configs:
      proxy_buffering: "on"
      proxy_buffer_size: "16k"
      proxy_busy_buffers_size: "24k"
      proxy_buffers: "64 16k"
      proxy_connect_timeout: "30s"
      proxy_send_timeout: "30s" 
      proxy_read_timeout: "30s"

  # Security headers template
  securityHeaders:
    add_header:
      X-Frame-Options: "SAMEORIGIN"
      X-Content-Type-Options: "nosniff"
      X-XSS-Protection: "1; mode=block"
      Strict-Transport-Security: "max-age=31536000; includeSubDomains"

  # API specific template
  apiEndpoint:
    proxy_set_header:
      Host: "$host"
      X-Real-IP: "$remote_addr"
      X-Forwarded-For: "$proxy_add_x_forwarded_for"
      X-Forwarded-Proto: "$scheme"
      Content-Type: "application/json"
    add_header:
      Access-Control-Allow-Origin: "*"
      Access-Control-Allow-Methods: "GET, POST, PUT, DELETE, OPTIONS"

servers:
  # Redirect server (www to non-www)
  - listen: "443 ssl"
    server_name: "www.mydomain.com"
    applyTemplates:
      - withSSL
      - securityHeaders
    configs:
      server_name_in_redirect: "on"
    return: "301 https://mydomain.com$request_uri"

  # Main application server
  - listen: "443 ssl http2"
    server_name: "mydomain.com"
    applyTemplates:
      - withSSL
      - securityHeaders
      - productionOptimized
    configs:
      server_name_in_redirect: "on"
      absolute_redirect: "off"
    limit_req:
      zone: global
      burst: 20
    locations:
      # Main app with authentication
      - path: "/"
        proxy_pass: "http://app:8080"
        applyTemplates:
          - withAuthentication
          - productionOptimized

      # WebSocket endpoint
      - path: "/ws"
        proxy_pass: "http://app:8080"
        applyTemplates:
          - webSocketSupport
          - withAuthentication

      # Public API endpoints
      - path: "~ ^/api/public"
        proxy_pass: "http://api:3000"
        applyTemplates:
          - apiEndpoint
        limit_req:
          zone: api
          burst: 50

      # Protected API endpoints
      - path: "~ ^/api/v1"
        proxy_pass: "http://api:3000"
        applyTemplates:
          - apiEndpoint
          - withAuthentication
        limit_req:
          zone: api
          burst: 30

      # Static assets (no auth needed)
      - path: "~ ^/(css|js|img|fonts)/"
        root: "/var/www/static"
        configs:
          expires: "1y"
          access_log: "off"
        add_header:
          Cache-Control: "public, immutable"

  # API-only server (different subdomain)
  - listen: "443 ssl"
    server_name: "api.mydomain.com"
    applyTemplates:
      - withSSL
      - securityHeaders
    locations:
      - path: "/"
        proxy_pass: "http://api:3000"
        applyTemplates:
          - apiEndpoint
          - withAuthentication
          - productionOptimized
        limit_req:
          zone: api
          burst: 100

# Global custom config for connection upgrade mapping
custom_global_config:
  - "map $http_upgrade $connection_upgrade"
  - "default upgrade"
  - "\"\" close"
